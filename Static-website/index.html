<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fabrizio Mastrogiovanni</title>
    <meta name="description" content="Cloud and AI automation. Founder of Growtonic Consulting.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #ffffff;
            --card: #f5f7fa;
            --border: #e3e8ef;
            --ink: #16181d;
            --muted: #5b6472;
            --accent: #0078d4;
            /* Azure blue */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Manrope', system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.55;
            display: flex;
            justify-content: center;
            padding: 64px 24px;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        /* ---------- Profile ---------- */
        .avatar {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--bg);
            box-shadow: 0 0 0 1px var(--border);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-top: 20px;
        }

        .role {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .bio {
            color: var(--muted);
            font-size: 0.95rem;
            margin-top: 14px;
        }

        /* ---------- Links ---------- */
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 32px;
        }

        .links a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--ink);
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .links a:hover {
            background: #ffffff;
            border-color: var(--accent);
        }

        .links a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .links svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .deploy-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            padding: 8px 14px;
            background: #eaf4fd;
            border: 1px solid #b8ddf7;
            border-radius: 999px;
            color: #0a5a9e;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .deploy-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
            }

            50% {
                box-shadow: 0 0 0 7px rgba(22, 163, 74, 0.05);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .deploy-badge .dot {
                animation: none;
            }
        }

        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>
